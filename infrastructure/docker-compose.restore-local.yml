# Isolated local recovery environment. It never references aire_* containers or volumes.
name: ecopredict_restore

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    container_name: ecopredict_restore_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB: ${APP_DB}
      TZ: ${GENERIC_TIMEZONE:-America/Lima}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - restore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [restore_network]

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.107.4
    container_name: ecopredict_restore_n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:15678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Lima}
      TZ: ${GENERIC_TIMEZONE:-America/Lima}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:15678:5678"
    volumes:
      - restore_n8n_data:/home/node/.n8n
      - restore_workflows:/workflows:ro
    networks: [restore_network]

  nginx:
    image: nginx:alpine
    container_name: ecopredict_restore_nginx
    depends_on: [n8n]
    command:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' 'server {' '  listen 80;' '  server_name _;' '  location / {' '    proxy_pass http://ecopredict_restore_n8n:5678;' '    proxy_http_version 1.1;' '    proxy_set_header Host $$host;' '    proxy_set_header X-Real-IP $$remote_addr;' '    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' '    proxy_set_header X-Forwarded-Proto $$scheme;' '    proxy_set_header Upgrade $$http_upgrade;' '    proxy_set_header Connection "upgrade";' '  }' '}' > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    ports:
      - "127.0.0.1:18080:80"
    networks: [restore_network]

volumes:
  restore_postgres_data:
    name: ecopredict_restore_postgres_data
  restore_n8n_data:
    name: ecopredict_restore_n8n_data
  restore_workflows:
    name: ecopredict_restore_workflows

networks:
  restore_network:
    name: ecopredict_restore_network
    driver: bridge
