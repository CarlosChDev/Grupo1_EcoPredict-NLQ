# Production topology: this file runs on docker-host (private subnet).
# nginx-host is the only public entry point and proxies HTTPS traffic to the
# private IP of docker-host on ports 8000 (Backend) and 5678 (n8n).
name: ecopredict-production

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      TZ: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecopredict_network

  backend:
    # The FastAPI repository/image and its runtime-variable contract are not
    # present yet. BACKEND_IMAGE must be an immutable image reference supplied
    # by the Backend team before deployment.
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the FastAPI image}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8000"
    ports:
      - "8000:8000"
    networks:
      - ecopredict_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_PUBLIC_HOST:?Set N8N_PUBLIC_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?Set N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?Set N8N_EDITOR_BASE_URL}
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE:?Set GENERIC_TIMEZONE}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ../src/n8n-workflows:/workflows:ro
    networks:
      - ecopredict_network

volumes:
  n8n_data:
    name: ecopredict_n8n_data
  postgres_data:
    name: ecopredict_postgres_data

networks:
  ecopredict_network:
    name: ecopredict_network
