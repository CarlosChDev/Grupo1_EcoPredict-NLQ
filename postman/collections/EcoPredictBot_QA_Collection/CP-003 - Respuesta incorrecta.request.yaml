$kind: http-request
name: CP-003 - Respuesta incorrecta
description: "Caso de prueba CP-003: Verifica que el endpoint identifique y rechace parámetros incorrectos."
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pregunta": "¿Cuál es el valor del parámetro?",
      "ciudad": "Lima",
      "parametro": "parametro_no_soportado_xyz"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("El endpoint devuelve código HTTP 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 3000
