$kind: http-request
description: "Caso de prueba CP-004: Comprueba que el modelo maneje consultas sobre datos inexistentes."
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "pregunta": "¿Existe registro de partículas PM2.5 en la estratósfera de Lima en el año 1500?",
      "ciudad": "Lima",
      "parametro": "pm25"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Tiempo de respuesta adecuado", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
    language: text/javascript
order: 4000
