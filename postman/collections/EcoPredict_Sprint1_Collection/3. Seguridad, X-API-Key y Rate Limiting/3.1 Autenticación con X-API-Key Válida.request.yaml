$kind: http-request
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Cuál es el estado general del aire en Lima?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Acceso autorizado con API Key', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 422]);
      });
    language: text/javascript
order: 1000
