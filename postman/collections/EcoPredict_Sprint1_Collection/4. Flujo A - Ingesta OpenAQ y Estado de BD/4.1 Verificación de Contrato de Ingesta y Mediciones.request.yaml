$kind: http-request
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Cuáles son las últimas mediciones ingeridas de la estación Campo de Marte?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      let res = {};
      try { res = pm.response.json(); } catch(e) { res = {}; }
      pm.test('Respuesta válida para ingesta y mediciones', function () {
          if (res.ok !== undefined) {
              pm.expect(res.ok).to.be.oneOf([true, false]);
          } else {
              pm.expect(pm.response.code).to.eql(200);
          }
      });
    language: text/javascript
order: 1000
