$kind: http-request
name: 4.1 Verificación de Contrato de Ingesta y Mediciones
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pregunta": "¿Cuáles son las últimas mediciones ingeridas de la estación Campo de Marte?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test('Respuesta válida para ingesta y mediciones', function () {
          pm.expect(res.ok).to.be.true;
          pm.expect(res.codigo_http).to.eql(200);
      });
    language: text/javascript
order: 1000
