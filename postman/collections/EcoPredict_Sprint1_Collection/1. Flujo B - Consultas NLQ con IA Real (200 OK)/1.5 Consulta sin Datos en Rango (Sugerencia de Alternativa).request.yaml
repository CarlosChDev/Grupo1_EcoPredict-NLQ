$kind: http-request
description: Valida el nodo 'Sugerir alternativa' cuando no existen mediciones en el rango solicitado.
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Cuál fue el nivel de ozono (O3) en el año 1990 en Lima?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      let res = {};
      try { res = pm.response.json(); } catch(e) { res = {}; }
      pm.test('Devuelve respuesta estructurada y no crashea', function () {
          if (res.ok !== undefined) {
              pm.expect(res.ok).to.be.oneOf([true, false]);
          } else {
              pm.expect(pm.response.code).to.eql(200);
          }
      });
    language: text/javascript
order: 5000
