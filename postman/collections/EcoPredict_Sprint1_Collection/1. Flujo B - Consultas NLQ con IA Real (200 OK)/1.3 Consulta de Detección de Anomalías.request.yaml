$kind: http-request
description: Evalúa consultas sobre detección de anomalías ambientales.
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Se detectaron picos inusuales o anomalías de PM10 en los últimos días?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      let res = {};
      try { res = pm.response.json(); } catch(e) { res = {}; }
      pm.test('Respuesta estructurada para anomalías', function () {
          if (res.ok !== undefined) {
              pm.expect(res.ok).to.be.oneOf([true, false]);
          } else {
              pm.expect(pm.response.code).to.eql(200);
          }
      });
    language: text/javascript
order: 3000
