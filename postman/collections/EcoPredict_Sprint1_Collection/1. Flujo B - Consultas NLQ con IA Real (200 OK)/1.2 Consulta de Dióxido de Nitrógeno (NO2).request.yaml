$kind: http-request
name: 1.2 Consulta de Dióxido de Nitrógeno (NO2)
description: Verifica la extracción de intención para el contaminante NO2.
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: json
  content: |-
    {
      "pregunta": "Muestra los valores de NO2 registrados recientemente en las estaciones de Lima"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test('Respuesta válida para parámetro NO2', function () {
          pm.expect(res.ok).to.be.true;
          pm.expect(res.codigo_http).to.eql(200);
      });
    language: text/javascript
order: 2000
