$kind: http-request
name: 1.4 Consulta de Rango Temporal Específico
description: Valida que el LLM extraiga correctamente las fechas desde y hasta.
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: json
  content: |-
    {
      "pregunta": "¿Cuál fue la concentración de SO2 entre el 1 de agosto y el 15 de agosto de 2026?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      const res = pm.response.json();
      pm.test('Parámetro SO2 y rango procesado', function () {
          pm.expect(res.ok).to.be.true;
          pm.expect(res.codigo_http).to.eql(200);
      });
    language: text/javascript
order: 4000
