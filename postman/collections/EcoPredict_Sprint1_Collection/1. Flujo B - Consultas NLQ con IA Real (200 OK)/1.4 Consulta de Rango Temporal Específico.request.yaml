$kind: http-request
description: Valida que el LLM extraiga correctamente las fechas desde y hasta.
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Cuál fue la concentración de SO2 entre el 1 de agosto y el 15 de agosto de 2026?"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200', function () {
          pm.response.to.have.status(200);
      });
      let res = {};
      try { res = pm.response.json(); } catch(e) { res = {}; }
      pm.test('Parámetro SO2 y rango procesado', function () {
          if (res.ok !== undefined) {
              pm.expect(res.ok).to.be.oneOf([true, false]);
          } else {
              pm.expect(pm.response.code).to.eql(200);
          }
      });
    language: text/javascript
order: 4000
