$kind: http-request
name: 2.4 Pregunta excesiva > 500 chars (400 Bad Request)
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
  X-API-Key: "{{api_key}}"
body:
  type: text
  content: |-
    {
      "pregunta": "¿Cuál es la calidad del aire? Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Repitiendo texto largo para superar quinientos caracteres exactos garantizados."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Validacion de peticion (400, 422 o 200 controlado)', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 422]);
      });
      let res = {};
      try { res = pm.response.json(); } catch(e) { res = {}; }
      pm.test('Respuesta estructurada y sin error 500 del servidor', function () {
          pm.expect(pm.response.code).to.not.equal(500);
      });
    language: text/javascript
order: 4000
