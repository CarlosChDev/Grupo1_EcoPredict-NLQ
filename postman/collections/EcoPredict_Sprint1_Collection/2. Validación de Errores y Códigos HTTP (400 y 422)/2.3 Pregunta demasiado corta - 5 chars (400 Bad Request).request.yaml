$kind: http-request
name: 2.3 Pregunta demasiado corta < 5 chars (400 Bad Request)
url: "{{base_url}}{{webhook_path}}"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "pregunta": "aire"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 400', function () {
          pm.response.to.have.status(400);
      });
      const res = pm.response.json();
      pm.test('Mensaje de longitud mínima', function () {
          pm.expect(res.errores[0]).to.include('demasiado corta');
      });
    language: text/javascript
order: 3000
