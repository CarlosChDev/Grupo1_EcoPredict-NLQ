name: CD - Pre-deployment Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecopredict-production-deployment
  cancel-in-progress: false

jobs:
  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_paths=(
            "src/n8n-workflows"
            "src/database/migrations"
            "infrastructure/docker-compose.yml"
            "infrastructure/nginx/default.conf"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required path not found: $path"
              exit 1
            fi
          done

          echo "All required paths exist."

      - name: Create test environment
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/ecopredict-test.env" <<'EOF'
          POSTGRES_USER=ecopredict_test
          POSTGRES_PASSWORD=TestPassword_123456
          POSTGRES_DB=ecopredict_test
          APP_DB=ecopredict_test
          GENERIC_TIMEZONE=America/Lima
          N8N_VERSION=1.107.4
          N8N_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          N8N_HOST=localhost
          N8N_PROTOCOL=http
          WEBHOOK_URL=http://localhost:5678/
          N8N_SECURE_COOKIE=false
          TELEGRAM_BOT_TOKEN=test_token
          EOF

          chmod 600 "$RUNNER_TEMP/ecopredict-test.env"

      - name: Validate Docker Compose configuration
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            config -q

      - name: Pull required images
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            pull postgres n8n

      - name: Start PostgreSQL and n8n
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d postgres n8n

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in {1..30}; do
            if docker compose \
              --project-name ecopredict-ci \
              --env-file "$RUNNER_TEMP/ecopredict-test.env" \
              -f infrastructure/docker-compose.yml \
              exec -T postgres pg_isready -U ecopredict_test -d ecopredict_test; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            sleep 5
          done

          echo "::error::PostgreSQL did not become ready."
          exit 1

      - name: Wait for n8n
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in {1..30}; do
            if curl --fail --silent http://localhost:5678/healthz >/dev/null; then
              echo "n8n is healthy."
              exit 0
            fi
            sleep 5
          done

          echo "::error::n8n did not become healthy."
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            logs n8n
          exit 1

      - name: Validate Nginx configuration
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            run --rm --no-deps aire_nginx nginx -t

      - name: Start all infrastructure services
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d

      - name: Verify Nginx proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in {1..12}; do
            if curl --fail --silent http://localhost/ >/dev/null; then
              echo "Nginx proxy is responding."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Nginx proxy did not respond successfully."
          exit 1

      - name: Show service status
        if: always()
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            ps || true

      - name: Cleanup test environment
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            down --volumes --remove-orphans || true

          rm -f "$RUNNER_TEMP/ecopredict-test.env"

  deploy-oci:
    name: Deploy Infrastructure to OCI
    needs: compose-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [[ -z "$OCI_KNOWN_HOSTS" ]]; then
            echo "::error::GitHub variable OCI_KNOWN_HOSTS is empty."
            exit 1
          fi

          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to OCI via SSH
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$OCI_HOST" || -z "$OCI_USER" ]]; then
            echo "::error::OCI_HOST or OCI_USER secret is empty."
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/ubuntu/Grupo1_EcoPredict-NLQ

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          COMPOSE=(
            docker compose
            --project-name calidad-aire
            --env-file .env
            -f infrastructure/docker-compose.yml
          )

          # Validate production configuration before applying changes.
          "${COMPOSE[@]}" config -q

          # Pull updated images and start core services.
          "${COMPOSE[@]}" pull postgres n8n
          "${COMPOSE[@]}" up -d postgres n8n

          # Wait for PostgreSQL health.
          for i in {1..30}; do
            if docker inspect \
              --format '{{.State.Health.Status}}' aire_postgres 2>/dev/null \
              | grep -qx healthy; then
              echo "PostgreSQL is healthy."
              break
            fi

            if [[ "$i" -eq 30 ]]; then
              echo "ERROR: PostgreSQL did not become healthy."
              docker logs --tail 100 aire_postgres || true
              exit 1
            fi

            sleep 5
          done

          # Validate Nginx configuration.
          "${COMPOSE[@]}" run --rm --no-deps aire_nginx nginx -t

          # Apply the complete Compose configuration.
          "${COMPOSE[@]}" up -d --remove-orphans

          # Reload Nginx if its container supports it.
          "${COMPOSE[@]}" exec -T aire_nginx nginx -t
          "${COMPOSE[@]}" exec -T aire_nginx nginx -s reload

          # Wait for n8n health.
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5678/healthz >/dev/null; then
              echo "n8n is healthy."
              break
            fi

            if [[ "$i" -eq 30 ]]; then
              echo "ERROR: n8n did not become healthy."
              docker logs --tail 100 aire_n8n || true
              exit 1
            fi

            sleep 5
          done

          # Verify the Nginx proxy.
          if ! curl --fail --silent http://localhost/ >/dev/null; then
            echo "ERROR: Nginx proxy verification failed."
            exit 1
          fi

          "${COMPOSE[@]}" ps
          echo "OCI deployment completed successfully."
          REMOTE
