name: CD - EcoPredict OCI

on:
  push:
    branches:
      - main
    paths:
      - "src/n8n-workflows/**"
      - "src/database/migrations/**"
      - "infrastructure/.env.example"
      - "infrastructure/docker-compose.yml"
      - "infrastructure/nginx/default.conf"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecopredict-production-deployment
  cancel-in-progress: false

jobs:
  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            src/n8n-workflows \
            src/database/migrations \
            infrastructure/docker-compose.yml \
            infrastructure/nginx/default.conf
          do
            if [ ! -e "$path" ]; then
              echo "::error::Missing required path: $path"
              exit 1
            fi
          done

      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ecopredict-test.env" <<'EOF'
          POSTGRES_USER=ecopredict_test
          POSTGRES_PASSWORD=ci_test_password_only
          POSTGRES_DB=ecopredict_test
          APP_DB=ecopredict_app_test
          GENERIC_TIMEZONE=America/Lima
          N8N_VERSION=1.107.4
          N8N_ENCRYPTION_KEY=ci_test_encryption_key_123456789012
          N8N_HOST=localhost
          N8N_PROTOCOL=http
          WEBHOOK_URL=http://localhost:5678/
          N8N_SECURE_COOKIE=false
          TELEGRAM_BOT_TOKEN=ci_test_token
          EOF

          chmod 600 "$RUNNER_TEMP/ecopredict-test.env"

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            config -q

      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

      - name: Start isolated integration environment
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d postgres n8n aire_nginx

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if docker compose \
              --project-name ecopredict-ci \
              --env-file "$RUNNER_TEMP/ecopredict-test.env" \
              -f infrastructure/docker-compose.yml \
              exec -T postgres sh -c \
              'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            then
              exit 0
            fi
            sleep 5
          done

          echo "::error::PostgreSQL did not become ready"
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml logs postgres
          exit 1

      - name: Verify pgvector extension is available
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS vector;"'

      - name: Wait for n8n
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5678/healthz >/dev/null; then
              echo "n8n health check passed"
              exit 0
            fi
            sleep 5
          done

          echo "::error::n8n did not become healthy"
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml logs n8n
          exit 1

      - name: Verify Nginx proxy
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 12); do
            if curl --fail --silent http://localhost/healthz >/dev/null; then
              echo "Nginx proxy check passed"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Nginx could not proxy the n8n health endpoint"
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml logs aire_nginx
          exit 1

      - name: Show integration test status
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml ps || true

      - name: Clean isolated CI environment
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            down --volumes --remove-orphans || true

          rm -f "$RUNNER_TEMP/ecopredict-test.env"

  deploy-oci:
    name: Deploy to OCI
    runs-on: ubuntu-latest
    needs: compose-validation
    timeout-minutes: 20

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$OCI_SSH_KEY" || {
            echo "::error::Missing secret OCI_SSH_KEY"
            exit 1
          }

          test -n "$OCI_KNOWN_HOSTS" || {
            echo "::error::Missing repository variable OCI_KNOWN_HOSTS"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key

          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy safely on OCI
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail

          test -n "$OCI_HOST" || {
            echo "::error::Missing secret OCI_HOST"
            exit 1
          }

          test -n "$OCI_USER" || {
            echo "::error::Missing secret OCI_USER"
            exit 1
          }

          ssh \
            -i ~/.ssh/oci_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          REPO_DIR="/home/ubuntu/Grupo1_EcoPredict-NLQ"
          EXPECTED_PG_VOLUME="aire_postgres_data_pgv"
          COMPOSE_FILE="infrastructure/docker-compose.yml"
          ENV_FILE="infrastructure/.env"

          cd "$REPO_DIR"

          echo "==> Updating repository to main"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          # Require the existing production environment file.
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: Production environment file not found: $ENV_FILE"
            echo "Deployment stopped without changing containers or volumes."
            exit 1
          fi

          echo "==> Validating production Compose configuration"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            config -q

          echo "==> Checking existing PostgreSQL container"
          if ! docker inspect aire_postgres >/dev/null 2>&1; then
            echo "ERROR: Existing PostgreSQL container was not found."
            echo "Deployment stopped to avoid initializing an unverified database."
            exit 1
          fi

          CURRENT_PG_VOLUME="$(
            docker inspect aire_postgres \
              --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}'
          )"

          echo "Current PostgreSQL volume: ${CURRENT_PG_VOLUME:-NOT_FOUND}"
          echo "Expected PostgreSQL volume: $EXPECTED_PG_VOLUME"

          if [ "$CURRENT_PG_VOLUME" != "$EXPECTED_PG_VOLUME" ]; then
            echo "ERROR: PostgreSQL volume mismatch."
            echo "Deployment stopped; no containers or volumes have been changed."
            exit 1
          fi

          echo "==> Checking that the current PostgreSQL container is running"
          PG_STATUS="$(docker inspect aire_postgres --format '{{.State.Status}}')"

          if [ "$PG_STATUS" != "running" ]; then
            echo "ERROR: PostgreSQL is not running (status: $PG_STATUS)."
            exit 1
          fi

          echo "==> Pulling required images"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            pull postgres n8n aire_nginx

          echo "==> Updating PostgreSQL and n8n"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d postgres n8n

          echo "==> Waiting for PostgreSQL health"
          PG_CONTAINER_ID="$(
            docker compose \
              --project-name calidad-aire \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" \
              ps -q postgres
          )"

          if [ -z "$PG_CONTAINER_ID" ]; then
            echo "ERROR: PostgreSQL container ID is unavailable."
            exit 1
          fi

          PG_READY=0

          for i in $(seq 1 30); do
            PG_HEALTH="$(
              docker inspect "$PG_CONTAINER_ID" \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}'
            )"

            echo "PostgreSQL status: $PG_HEALTH"

            if [ "$PG_HEALTH" = "healthy" ]; then
              PG_READY=1
              break
            fi

            if [ "$PG_HEALTH" = "unhealthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$PG_READY" -ne 1 ]; then
            echo "ERROR: PostgreSQL did not become healthy."
            docker compose \
              --project-name calidad-aire \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" logs --tail=100 postgres
            exit 1
          fi

          echo "==> Checking PostgreSQL and pgvector"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1;" -c "SELECT extname FROM pg_extension WHERE extname = '\''vector'\'';"'

          echo "==> Validating Nginx configuration"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            run --rm --no-deps aire_nginx nginx -t

          echo "==> Starting/reconciling services"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d --remove-orphans

          echo "==> Reloading Nginx"
          docker exec aire_nginx nginx -s reload

          echo "==> Waiting for n8n health"
          N8N_READY=0

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5678/healthz >/dev/null; then
              N8N_READY=1
              break
            fi
            sleep 5
          done

          if [ "$N8N_READY" -ne 1 ]; then
            echo "ERROR: n8n health check failed."
            docker compose \
              --project-name calidad-aire \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" logs --tail=100 n8n
            exit 1
          fi

          echo "==> Checking public reverse proxy"
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1/healthz >/dev/null

          echo "==> Final service status"
          docker compose \
            --project-name calidad-aire \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" ps

          echo "Deployment completed successfully."
          REMOTE

      - name: Remove SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/oci_key ~/.ssh/known_hosts
