name: CD - Pre-deployment Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecopredict-production-deployment
  cancel-in-progress: false

jobs:
  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_paths=(
            "src/n8n-workflows"
            "src/database/migrations"
            "infrastructure/docker-compose.yml"
            ".env.example"
            "infrastructure/nginx/default.conf"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required path not found: $path"
              exit 1
            fi
          done

          echo "Required files validated."

      - name: Set up Docker Compose test environment
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/ecopredict-test.env" <<'EOF'
          POSTGRES_USER=ecopredict_test
          POSTGRES_PASSWORD=TestPassword_123456
          POSTGRES_DB=ecopredict_test
          APP_DB=ecopredict_test
          GENERIC_TIMEZONE=America/Lima
          N8N_VERSION=1.107.4
          N8N_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          N8N_HOST=localhost
          N8N_PROTOCOL=http
          WEBHOOK_URL=http://localhost:5678/
          N8N_SECURE_COOKIE=false
          TELEGRAM_BOT_TOKEN=test_token
          EOF

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            config -q

          echo "Docker Compose configuration is valid."

      - name: Pull service images
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            pull

      - name: Start PostgreSQL and n8n
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d postgres n8n

      - name: Wait for PostgreSQL and n8n
        shell: bash
        run: |
          set -Eeuo pipefail

          COMPOSE=(
            docker compose
            --project-name ecopredict-ci
            --env-file "$RUNNER_TEMP/ecopredict-test.env"
            -f infrastructure/docker-compose.yml
          )

          postgres_ready=false
          for attempt in $(seq 1 30); do
            if "${COMPOSE[@]}" exec -T postgres \
              pg_isready -U ecopredict_test -d ecopredict_test; then
              postgres_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$postgres_ready" != "true" ]]; then
            echo "::error::PostgreSQL did not become ready."
            "${COMPOSE[@]}" logs postgres
            exit 1
          fi

          n8n_ready=false
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:5678/healthz >/dev/null; then
              n8n_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$n8n_ready" != "true" ]]; then
            echo "::error::n8n did not become ready."
            "${COMPOSE[@]}" logs n8n
            exit 1
          fi

          echo "PostgreSQL and n8n are ready."

      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            run --rm --no-deps aire_nginx nginx -t

      - name: Start all infrastructure services
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d

      - name: Verify Nginx reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          COMPOSE=(
            docker compose
            --project-name ecopredict-ci
            --env-file "$RUNNER_TEMP/ecopredict-test.env"
            -f infrastructure/docker-compose.yml
          )

          "${COMPOSE[@]}" exec -T aire_nginx nginx -t

          proxy_ready=false
          for attempt in $(seq 1 30); do
            if curl -sS -o /dev/null \
              --max-time 5 http://localhost/; then
              proxy_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$proxy_ready" != "true" ]]; then
            echo "::error::Nginx reverse proxy did not respond."
            "${COMPOSE[@]}" logs aire_nginx n8n
            exit 1
          fi

          echo "Nginx reverse proxy is responding."

      - name: Show service status
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            ps || true

      - name: Show logs if validation fails
        if: failure()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            logs --no-color || true

      - name: Clean up test environment
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ecopredict-test.env" ]]; then
            docker compose \
              --project-name ecopredict-ci \
              --env-file "$RUNNER_TEMP/ecopredict-test.env" \
              -f infrastructure/docker-compose.yml \
              down --volumes --remove-orphans || true

            rm -f "$RUNNER_TEMP/ecopredict-test.env"
          fi

  deploy-oci:
    name: Deploy Infrastructure to OCI
    runs-on: ubuntu-latest
    needs: compose-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [[ -z "$OCI_KNOWN_HOSTS" ]]; then
            echo "::error::GitHub variable OCI_KNOWN_HOSTS is empty."
            exit 1
          fi

          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to OCI
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$OCI_HOST" || -z "$OCI_USER" ]]; then
            echo "::error::OCI_HOST or OCI_USER is not configured."
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          REPO_DIR="/home/ubuntu/Grupo1_EcoPredict-NLQ"
          cd "$REPO_DIR"

          echo "Fetching latest main..."
          git fetch --prune origin
          git checkout main
          git reset --hard origin/main

          COMPOSE=(
            docker compose
            --project-name calidad-aire
            --env-file .env
            -f infrastructure/docker-compose.yml
          )

          echo "Validating Compose configuration..."
          "${COMPOSE[@]}" config -q

          echo "Pulling infrastructure images..."
          "${COMPOSE[@]}" pull

          echo "Starting PostgreSQL and n8n..."
          "${COMPOSE[@]}" up -d postgres n8n

          echo "Waiting for PostgreSQL..."
          postgres_ready=false

          for attempt in $(seq 1 30); do
            if docker inspect \
              --format '{{.State.Health.Status}}' aire_postgres 2>/dev/null \
              | grep -qx healthy; then
              postgres_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$postgres_ready" != "true" ]]; then
            echo "ERROR: PostgreSQL did not become healthy."
            "${COMPOSE[@]}" logs postgres
            exit 1
          fi

          echo "Validating Nginx configuration..."
          "${COMPOSE[@]}" run --rm --no-deps aire_nginx nginx -t

          echo "Starting/updating all infrastructure services..."
          "${COMPOSE[@]}" up -d --remove-orphans

          echo "Validating active Nginx configuration..."
          "${COMPOSE[@]}" exec -T aire_nginx nginx -t

          echo "Reloading Nginx..."
          "${COMPOSE[@]}" exec -T aire_nginx nginx -s reload

          echo "Waiting for n8n..."
          n8n_ready=false

          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 5 \
              http://localhost:5678/healthz >/dev/null; then
              n8n_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$n8n_ready" != "true" ]]; then
            echo "ERROR: n8n did not become ready."
            "${COMPOSE[@]}" logs n8n
            exit 1
          fi

          echo "Checking Nginx reverse proxy..."
          proxy_ready=false

          for attempt in $(seq 1 15); do
            if curl -sS -o /dev/null --max-time 5 \
              http://localhost/; then
              proxy_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$proxy_ready" != "true" ]]; then
            echo "ERROR: Nginx reverse proxy is not responding."
            "${COMPOSE[@]}" logs aire_nginx n8n
            exit 1
          fi

          echo "Final infrastructure status:"
          "${COMPOSE[@]}" ps

          echo "OCI infrastructure deployment completed successfully."
          REMOTE_SCRIPT
