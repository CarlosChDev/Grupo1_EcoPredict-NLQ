name: CD - Pre-deployment Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/"
      - "src/database/migrations/"
      - "src/n8n-workflows/**"
      - ".github/workflows/cd.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/"
      - "src/database/migrations/"
      - "src/n8n-workflows/**"
      - ".github/workflows/cd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecopredict-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compose-validation:
    name: Validate Compose, PostgreSQL, n8n and Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f infrastructure/docker-compose.yml
          test -f infrastructure/nginx/default.conf
          test -d src/database/migrations
          test -d src/n8n-workflows

      - name: Prepare CI environment
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ecopredict-test.env" <<'EOF'
          POSTGRES_USER=ecopredict_ci
          POSTGRES_PASSWORD=ci_only_password
          POSTGRES_DB=ecopredict_ci
          N8N_VERSION=1.107.4
          N8N_ENCRYPTION_KEY=ci_only_encryption_key_123456789012
          N8N_HOST=localhost
          N8N_PROTOCOL=http
          N8N_PORT=5678
          WEBHOOK_URL=http://localhost:5678/
          GENERIC_TIMEZONE=America/Lima
          TZ=America/Lima
          EOF

          chmod 600 "$RUNNER_TEMP/ecopredict-test.env"

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            config -q

      - name: Start PostgreSQL and n8n
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d postgres n8n

      - name: Wait for PostgreSQL health
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE="docker compose --project-name ecopredict-ci --env-file $RUNNER_TEMP/ecopredict-test.env -f infrastructure/docker-compose.yml"

          for attempt in $(seq 1 60); do
            STATUS=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              aire_postgres 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi

            echo "Waiting for PostgreSQL ($attempt/60): $STATUS"
            sleep 3
          done

          docker logs aire_postgres || true
          echo "PostgreSQL did not become healthy."
          exit 1

      - name: Verify pgvector extension
        shell: bash
        run: |
          set -euo pipefail

          docker exec aire_postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1;"'

          docker exec aire_postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_available_extensions WHERE name = '\''vector'\'';"' \
            | grep -qx '1'

          echo "pgvector is available."

      - name: Wait for n8n readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:5678/healthz >/dev/null; then
              echo "n8n is ready."
              exit 0
            fi

            echo "Waiting for n8n ($attempt/60)..."
            sleep 3
          done

          docker logs aire_n8n || true
          echo "n8n did not become ready."
          exit 1

      - name: Validate Nginx configuration on Compose network
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            run --rm --no-deps aire_nginx nginx -t

      - name: Start Nginx integration service
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d aire_nginx

      - name: Verify Nginx proxy
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1/healthz >/dev/null; then
              echo "Nginx proxy is responding."
              exit 0
            fi

            echo "Waiting for Nginx ($attempt/30)..."
            sleep 2
          done

          docker logs aire_nginx || true
          echo "Nginx proxy validation failed."
          exit 1

      - name: Show container status
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            ps -a || true

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          for container in aire_postgres aire_n8n aire_nginx; do
            echo "===== Logs: $container ====="
            docker logs "$container" || true
          done

      - name: Clean up CI environment
        if: always()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            down --volumes --remove-orphans || true

          rm -f "$RUNNER_TEMP/ecopredict-test.env"

  deploy-oci:
    name: Deploy to OCI
    needs: compose-validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$OCI_SSH_KEY"
          test -n "${{ secrets.OCI_HOST }}"
          test -n "${{ secrets.OCI_USER }}"
          test -n "$OCI_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$OCI_SSH_KEY" > "$RUNNER_TEMP/oci_key"
          chmod 600 "$RUNNER_TEMP/oci_key"

          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$RUNNER_TEMP/oci_known_hosts"
          chmod 600 "$RUNNER_TEMP/oci_known_hosts"

      - name: Deploy and validate on OCI
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/oci_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/oci_known_hosts" \
            "$OCI_USER@$OCI_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          REPO_DIR="/home/ubuntu/Grupo1_EcoPredict-NLQ"
          COMPOSE_FILE="infrastructure/docker-compose.yml"
          ENV_FILE="infrastructure/.env"
          EXPECTED_PG_VOLUME="aire_postgres_data_pgv"

          cd "$REPO_DIR"

          echo "===== Update repository ====="
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "===== Verify production environment ====="
          test -f "$ENV_FILE"
          test -f "$COMPOSE_FILE"
          test -f "infrastructure/nginx/default.conf"

          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            config -q

          echo "===== Protect PostgreSQL data volume ====="

          if ! docker inspect aire_postgres >/dev/null 2>&1; then
            echo "ERROR: aire_postgres does not exist."
            echo "Refusing automatic deployment without verifying the existing database volume."
            exit 1
          fi

          ACTUAL_PG_VOLUME=$(docker inspect \
            --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' \
            aire_postgres)

          if [ "$ACTUAL_PG_VOLUME" != "$EXPECTED_PG_VOLUME" ]; then
            echo "ERROR: PostgreSQL volume mismatch."
            echo "Expected: $EXPECTED_PG_VOLUME"
            echo "Actual:   $ACTUAL_PG_VOLUME"
            echo "Deployment stopped to protect database data."
            exit 1
          fi

          echo "Verified PostgreSQL volume: $ACTUAL_PG_VOLUME"

          echo "===== Pull images ====="
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            pull postgres n8n aire_nginx

          echo "===== Start PostgreSQL and n8n ====="
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d postgres n8n

          echo "===== Wait for PostgreSQL ====="
          PG_READY=false

          for attempt in $(seq 1 60); do
            STATUS=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              aire_postgres 2>/dev/null || true)

            if [ "$STATUS" = "healthy" ]; then
              PG_READY=true
              break
            fi

            echo "Waiting for PostgreSQL ($attempt/60): $STATUS"
            sleep 5
          done

          if [ "$PG_READY" != "true" ]; then
            docker logs aire_postgres || true
            echo "ERROR: PostgreSQL did not become healthy."
            exit 1
          fi

          echo "===== Verify PostgreSQL and pgvector ====="
          docker exec aire_postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1;"'

          VECTOR_AVAILABLE=$(docker exec aire_postgres sh -lc \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_extension WHERE extname = '\''vector'\'';"' \
            | tr -d '[:space:]')

          if [ "$VECTOR_AVAILABLE" != "1" ]; then
            echo "ERROR: pgvector extension is not installed in the database."
            exit 1
          fi

          echo "pgvector is installed."

          echo "===== Wait for n8n ====="
          N8N_READY=false

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              http://127.0.0.1:5678/healthz >/dev/null; then
              N8N_READY=true
              break
            fi

            echo "Waiting for n8n ($attempt/60)..."
            sleep 5
          done

          if [ "$N8N_READY" != "true" ]; then
            docker logs aire_n8n || true
            echo "ERROR: n8n did not become ready."
            exit 1
          fi

          echo "===== Validate Nginx on Compose network ====="
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            run --rm --no-deps aire_nginx nginx -t

          echo "===== Start services ====="
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            up -d --remove-orphans

          echo "===== Reload Nginx ====="
          docker exec aire_nginx nginx -s reload

          echo "===== Verify n8n health ====="
          curl --fail --silent --show-error \
            http://127.0.0.1:5678/healthz >/dev/null

          echo "===== Verify public Nginx proxy ====="
          curl --fail --silent --show-error \
            http://127.0.0.1/healthz >/dev/null

          echo "===== Final container status ====="
          docker compose \
            --env-file "$ENV_FILE" \
            -f "$COMPOSE_FILE" \
            ps

          echo "Deployment and health checks completed."
          REMOTE

      - name: Clean up SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/oci_key"
          rm -f "$RUNNER_TEMP/oci_known_hosts"
