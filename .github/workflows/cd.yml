name: CD - Pre-deployment Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecopredict-production-deployment
  cancel-in-progress: false

jobs:
  compose-validation:
    name: Validate Docker Compose and Services
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_paths=(
            "src/n8n-workflows"
            "src/database/migrations"
            "infrastructure/docker-compose.yml"
            "infrastructure/.env.example"
            "infrastructure/nginx/default.conf"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "::error::Required path not found: $path"
              exit 1
            fi
          done

          echo "All required infrastructure files exist."

      - name: Prepare test environment
        shell: bash
        run: |
          {
            echo "POSTGRES_USER=ecopredict_test"
            echo "POSTGRES_PASSWORD=TestPassword_123456"
            echo "POSTGRES_DB=ecopredict_test"
            echo "APP_DB=ecopredict_test"
            echo "GENERIC_TIMEZONE=America/Lima"
            echo "N8N_VERSION=1.107.4"
            echo "N8N_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef"
            echo "N8N_HOST=localhost"
            echo "N8N_PROTOCOL=http"
            echo "WEBHOOK_URL=http://localhost:5678/"
            echo "N8N_SECURE_COOKIE=false"
            echo "TELEGRAM_BOT_TOKEN=test_token"
          } > "$RUNNER_TEMP/ecopredict-test.env"

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            config -q

      - name: Pull container images
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            pull

      - name: Validate Nginx configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            run --rm --no-deps aire_nginx nginx -t

      - name: Start services
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            up -d

      - name: Verify PostgreSQL health
        shell: bash
        run: |
          set -Eeuo pipefail

          container_id="$(docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            ps -q postgres)"

          for attempt in $(seq 1 30); do
            status="$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$container_id")"

            if [[ "$status" == "healthy" ]]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "::error::PostgreSQL did not become healthy."
          exit 1

      - name: Verify n8n readiness
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:5678/healthz/readiness; then
              echo
              echo "n8n readiness check passed."
              exit 0
            fi

            sleep 5
          done

          echo "::error::n8n did not become ready."
          exit 1

      - name: Verify Nginx reverse proxy
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 15); do
            if curl --fail --silent \
              --output /dev/null \
              http://127.0.0.1:80/; then
              echo "Nginx reverse proxy check passed."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Nginx did not successfully proxy requests."
          exit 1

      - name: Show service logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose \
            --project-name ecopredict-ci \
            --env-file "$RUNNER_TEMP/ecopredict-test.env" \
            -f infrastructure/docker-compose.yml \
            logs --no-color || true

      - name: Stop test services
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ecopredict-test.env" ]]; then
            docker compose \
              --project-name ecopredict-ci \
              --env-file "$RUNNER_TEMP/ecopredict-test.env" \
              -f infrastructure/docker-compose.yml \
              down --volumes --remove-orphans || true
          fi

  deploy-oci:
    name: Deploy Infrastructure to OCI
    needs: compose-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only changes merged or pushed to main deploy to the shared production VM.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_KEY }}

      - name: Configure known hosts
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$OCI_HOST" ]]; then
            echo "::error::GitHub secret OCI_HOST is missing."
            exit 1
          fi

          if [[ -z "$OCI_KNOWN_HOSTS" ]]; then
            echo "::error::GitHub variable OCI_KNOWN_HOSTS is missing."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify services on OCI
        shell: bash
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$OCI_USER" ]]; then
            echo "::error::GitHub secret OCI_USER is missing."
            exit 1
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_USER@$OCI_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/ubuntu/Grupo1_EcoPredict-NLQ"
          COMPOSE_FILE="infrastructure/docker-compose.yml"

          cd "$APP_DIR"

          if [[ ! -f ".env" ]]; then
            echo "ERROR: Production .env file is missing."
            exit 1
          fi

          git fetch --prune origin
          git checkout main
          git reset --hard origin/main

          for path in \
            "$COMPOSE_FILE" \
            "infrastructure/nginx/default.conf" \
            "src/n8n-workflows" \
            "src/database/migrations"; do
            if [[ ! -e "$path" ]]; then
              echo "ERROR: Required path not found: $path"
              exit 1
            fi
          done

          compose() {
            docker compose --project-name calidad-aire \
              --env-file .env \
              -f "$COMPOSE_FILE" "$@"
          }

          echo "Validating production Compose configuration..."
          compose config -q

          echo "Pulling container images..."
          compose pull

          echo "Validating Nginx configuration..."
          compose run --rm --no-deps aire_nginx nginx -t

          echo "Starting/updating infrastructure services..."
          compose up -d --remove-orphans

          echo "Reloading Nginx configuration..."
          compose exec -T aire_nginx nginx -t
          compose exec -T aire_nginx nginx -s reload

          echo "Checking PostgreSQL health..."
          POSTGRES_ID="$(compose ps -q postgres)"

          if [[ -z "$POSTGRES_ID" ]]; then
            echo "ERROR: PostgreSQL container was not found."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "$POSTGRES_ID")"

            if [[ "$STATUS" == "healthy" ]]; then
              echo "PostgreSQL is healthy."
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "ERROR: PostgreSQL did not become healthy."
              compose logs --tail=100 postgres
              exit 1
            fi

            sleep 2
          done

          echo "Checking n8n readiness..."
          N8N_OK=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:5678/healthz/readiness \
              --output /dev/null; then
              N8N_OK=true
              break
            fi

            sleep 5
          done

          if [[ "$N8N_OK" != "true" ]]; then
            echo "ERROR: n8n readiness check failed."
            compose logs --tail=100 n8n
            exit 1
          fi

          echo "Checking Nginx reverse proxy..."
          if ! curl --fail --silent \
            --output /dev/null \
            http://127.0.0.1:80/; then
            echo "ERROR: Nginx reverse proxy check failed."
            compose logs --tail=100 aire_nginx
            exit 1
          fi

          echo "Final service status:"
          compose ps

          echo "OCI infrastructure deployment completed successfully."
          REMOTE
