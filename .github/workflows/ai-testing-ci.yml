name: AI Testing CI

on:
  # Keep this workflow visible to Rulesets on every PR. Individual steps are
  # conditionally executed after inspecting the changed paths.
  pull_request:
  push:
    branches:
      - main
      - Chavez

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      # This is also needed for push events, where paths-filter uses git.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ai:
              - 'src/ia-ops/**'
              - '.github/workflows/ai-testing-ci.yml'
            global:
              - '!src/frontend/**'
              - '!src/n8n-workflows/**'
              - '!src/ia-ops/**'
          predicate-quantifier: every

  ai-testing:
    name: AI Ops Validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped validation
        if: ${{ needs.changes.outputs.ai != 'true' && needs.changes.outputs.global != 'true' }}
        run: echo "No IA Ops or shared files changed; AI Ops validation is not required."

      - name: Checkout repository
        if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.global == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Python
        if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.global == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check IA Ops structure
        if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          echo "Checking IA Ops directories..."

          test -d "src/ia-ops/prompts"
          test -d "src/ia-ops/tests"
          test -d "src/ia-ops/config-observability"

          echo "IA Ops structure is valid."

      - name: Install pytest
        if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        if: ${{ needs.changes.outputs.ai == 'true' || needs.changes.outputs.global == 'true' }}
        run: pytest src/ia-ops/tests -v
