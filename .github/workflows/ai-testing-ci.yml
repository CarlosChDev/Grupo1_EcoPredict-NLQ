name: AI Testing CI

on:
  pull_request:
    paths:
      - "src/ia-ops/**"
      - ".github/workflows/ai-testing-ci.yml"

  push:
    branches:
      - main
      - Chavez
    paths:
      - "src/ia-ops/**"

jobs:
  ai-testing:
    name: AI Ops Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check IA Ops structure
        run: |
          echo "Checking IA Ops directories..."

          test -d "src/ia-ops/prompts"
          test -d "src/ia-ops/tests"
          test -d "src/ia-ops/config-observability"

          echo "IA Ops structure is valid."

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: |
          pytest src/ia-ops/tests -v
