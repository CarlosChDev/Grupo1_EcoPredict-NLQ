name: Newman QA CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - Chavez
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newman-qa:
    name: Newman API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify QA collection
        run: |
          test -f src/ia-ops/tests/postman/eco_predict_nlq_collection.json
          echo "QA collection found."

      - name: Create ephemeral CI variables
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "COMPOSE_PROJECT_NAME=ecopredict-newman-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "N8N_VERSION=1.107.4"
            echo "POSTGRES_USER=ci_n8n_user"
            echo "POSTGRES_PASSWORD=ci_password_${GITHUB_RUN_ID}"
            echo "POSTGRES_DB=ci_n8n"
            echo "APP_DB=ci_calidad_aire"
            echo "GENERIC_TIMEZONE=America/Lima"
            echo "N8N_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            config -q

          echo "Docker Compose configuration is valid."

      - name: Start ephemeral QA environment
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            pull

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            up -d

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            ps

          echo "Ephemeral QA environment started."

      - name: Wait for PostgreSQL health
        shell: bash
        run: |
          set -euo pipefail

          postgres_id="$(
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              -f infrastructure/docker-compose.yml \
              ps -q postgres
          )"

          if [ -z "$postgres_id" ]; then
            echo "PostgreSQL container was not created."
            exit 1
          fi

          for attempt in {1..36}; do
            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                "$postgres_id" 2>/dev/null || true
            )"

            if [ "$status" = "healthy" ]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi

            echo "Waiting for PostgreSQL health check ($attempt/36): ${status:-unavailable}"
            sleep 5
          done

          echo "PostgreSQL did not become healthy in time."
          exit 1

      - name: Wait for n8n readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..36}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --output /dev/null \
              http://127.0.0.1:5678/healthz/readiness; then

              echo "n8n is ready."
              exit 0
            fi

            echo "Waiting for n8n readiness endpoint ($attempt/36)."
            sleep 5
          done

          echo "n8n did not become ready in time."
          exit 1

      - name: Import FLUJO B into n8n
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            exec -T n8n \
            n8n import:workflow \
            --input="/workflows/FLUJO B.json"

          echo "FLUJO B imported into n8n."

      - name: Activate FLUJO B
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            exec -T n8n \
            n8n update:workflow \
            --id=vQie4yWQPUsRGdif \
            --active=true

          echo "FLUJO B activated."

      - name: Restart n8n to apply workflow activation
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            restart n8n

          echo "n8n restarted to apply workflow activation."

      - name: Wait for n8n after workflow activation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..36}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --output /dev/null \
              http://127.0.0.1:5678/healthz/readiness; then

              echo "n8n is ready after workflow activation."
              exit 0
            fi

            echo "Waiting for n8n after restart ($attempt/36)."
            sleep 5
          done

          echo "n8n did not become ready after restart."
          exit 1

      - name: Verify NLQ webhook
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..12}; do
            status="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                -X POST \
                -H 'Content-Type: application/json' \
                -d '{"pregunta":"consulta de calidad del aire"}' \
                http://127.0.0.1:5678/webhook/nlq
            )"

            echo "Webhook HTTP status: $status"

            if [ "$status" != "404" ]; then
              echo "NLQ webhook is registered."
              exit 0
            fi

            echo "Webhook is not ready yet ($attempt/12)."
            sleep 5
          done

          echo "NLQ webhook is still returning 404."
          exit 1

      - name: Install Newman
        run: |
          npm install --global newman@6.2.1
          newman --version

      - name: Run QA collection with Newman
        run: |
          echo "Running QA collection with Newman."

          newman run \
            src/ia-ops/tests/postman/eco_predict_nlq_collection.json \
            --env-var base_url=http://127.0.0.1:5678 \
            --env-var webhook_path=/webhook/nlq \
            --reporters cli

          echo "Newman QA collection passed."

      - name: Show Compose logs after a failure
        if: ${{ failure() }}
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            logs --no-color

      - name: Remove ephemeral QA environment
        if: ${{ always() }}
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            -f infrastructure/docker-compose.yml \
            down --volumes --remove-orphans

          echo "Ephemeral QA environment removed."
