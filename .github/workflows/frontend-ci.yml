name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate monorepo structure
        shell: bash
        run: |
          set -Eeuo pipefail

          required_paths=(
            "package.json"
            "package-lock.json"
            "packages/ui-shell/package.json"
            "src/frontend-shell/package.json"
            "src/microfrontends/ajustes/package.json"
            "src/microfrontends/dashboard-ambiental/package.json"
            "src/microfrontends/data-analytics/package.json"
            "src/microfrontends/estado-sistema/package.json"
            "src/microfrontends/nlq-chat/package.json"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Required file not found: $path"
              exit 1
            fi
          done

          echo "Monorepo structure validated."

      - name: Install dependencies
        run: npm ci

      - name: Build all frontend workspaces
        run: npm run build:all
