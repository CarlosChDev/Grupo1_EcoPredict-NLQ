name: Frontend CI

on:
  # Do not filter pull_request here. A required workflow must always create a
  # status check; filtering is performed by the changes job below.
  pull_request:
  push:
    branches:
      - main
      - Chavez

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      # This is also needed for push events, where paths-filter uses git.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/frontend-shell/**'
              - 'src/microfrontends/**'
              - '.github/workflows/frontend-ci.yml'
            # Any file outside the three isolated components is treated as a
            # shared change. This is conservative for infrastructure, database,
            # root configuration and CI changes.
            global:
              - '!src/frontend-shell/**'
              - '!src/microfrontends/**'
              - '!src/n8n-workflows/**'
              - '!src/ia-ops/**'
          predicate-quantifier: every

  frontend-ci:
    name: Frontend Validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped validation
        if: ${{ needs.changes.outputs.frontend != 'true' && needs.changes.outputs.global != 'true' }}
        run: echo "No frontend or shared files changed; frontend validation is not required."

      - name: Checkout repository
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        uses: actions/checkout@v4

      - name: Check frontend structure
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          echo "Checking frontend-shell and microfrontends directories..."

          if [ ! -d "src/frontend-shell" ]; then
            echo "Frontend shell directory not found."
            exit 1
          fi

          if [ ! -d "src/microfrontends" ]; then
            echo "Microfrontends directory not found."
            exit 1
          fi

          echo "Frontend directories exist."

      - name: Check package.json
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          missing=0

          if [ ! -f "src/frontend-shell/package.json" ]; then
            echo "package.json not found in src/frontend-shell."
            missing=1
          fi

          for dir in src/microfrontends/*/; do
            if [ ! -f "${dir}package.json" ]; then
              echo "package.json not found in ${dir}."
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "One or more frontend packages are missing package.json."
            exit 1
          fi

          echo "All frontend packages have package.json."
