name: Frontend CI

on:
  # Do not filter pull_request here. A required workflow must always create a
  # status check; filtering is performed by the changes job below.
  pull_request:
  push:
    branches:
      - main
      - Chavez

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      # This is also needed for push events, where paths-filter uses git.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/frontend-ci.yml'
            # Any file outside the three isolated components is treated as a
            # shared change. This is conservative for infrastructure, database,
            # root configuration and CI changes.
            global:
              - '!src/frontend/**'
              - '!src/n8n-workflows/**'
              - '!src/ia-ops/**'
          predicate-quantifier: every

  frontend-ci:
    name: Frontend Validation
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped validation
        if: ${{ needs.changes.outputs.frontend != 'true' && needs.changes.outputs.global != 'true' }}
        run: echo "No frontend or shared files changed; frontend validation is not required."

      - name: Checkout repository
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        uses: actions/checkout@v4

      - name: Check frontend structure
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          echo "Checking frontend directory..."

          if [ ! -d "src/frontend" ]; then
            echo "Frontend directory not found."
            exit 1
          fi

          echo "Frontend directory exists."

      - name: Check package.json
        if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.global == 'true' }}
        run: |
          if [ -f "src/frontend/package.json" ]; then
            echo "package.json found."
          else
            echo "package.json not found."
            echo "Frontend implementation is not available yet."
          fi
